name: cardlake
label: Cardlake
version: 0.6.0
author: Cardlake
license: AGPL-3.0-only
homepage: https://github.com/cardleforall/cardlake-hermes
description: >
  Your Cardlake cards in Hermes, laid out as cards in Telegram. /cardlake feed
  and today show your feed and what's due, save and snooze change cards, and a
  morning blueprint sends what's overdue or due today. Passwords, API keys and
  tokens are removed before anything is sent. Needs a Cardlake account.
provides_tools:
  - cardlake_today
  - cardlake_show_cards
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_llm_output
