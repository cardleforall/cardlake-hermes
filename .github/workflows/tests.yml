name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a Hermes change that breaks the plugin shows up here first
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -t . -s tests -v

  real-hermes:
    name: Against the latest Hermes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hermes can't be pip-installed; this builds it the way its own plugin validator does.
      - name: Get Hermes
        run: |
          git clone --depth=1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes"
          python3 -S "$RUNNER_TEMP/hermes/scripts/ci/setup_toolchain.py" prepare --toolchain python --home "$RUNNER_TEMP/hermes/.build/pm"
          python3 -S "$RUNNER_TEMP/hermes/scripts/ci/setup_toolchain.py" install --toolchain python --home "$RUNNER_TEMP/hermes/.build/pm"
      - name: Build Hermes' Python environment
        working-directory: ${{ runner.temp }}/hermes
        run: |
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from pm import build_environment
          source = Path(os.environ["RUNNER_TEMP"]) / "hermes"
          python = build_environment(source=source, out=source / ".build/env", explicit=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"HERMES_ENV_PYTHON={python}\n")
          PY
      - name: Hermes Plugin Doctor
        run: '"$HERMES_ENV_PYTHON" -m hermes_cli.main plugins doctor . --ci'
      - name: Run every test, none skipped
        run: |
          "$HERMES_ENV_PYTHON" -m unittest discover -t . -s tests -v 2>&1 | tee results.txt
          if grep -qE "^(OK|FAILED) \(.*skipped" results.txt; then
            echo "::error::Some tests were skipped, so they didn't run against Hermes"
            exit 1
          fi

  validate:
    name: Hermes plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
        with:
          path: .
