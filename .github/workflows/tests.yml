name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a Hermes change that breaks the plugin shows up here first
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -t . -s tests -v

  real-hermes:
    name: Against the latest Hermes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes
        run: python -m pip install "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@main"
      - name: Run every test, none skipped
        run: |
          python -m unittest discover -t . -s tests -v 2>&1 | tee results.txt
          if grep -q "skipped" results.txt; then
            echo "::error::Some tests were skipped, so they didn't run against Hermes"
            exit 1
          fi

  validate:
    name: Hermes plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
        with:
          path: .
