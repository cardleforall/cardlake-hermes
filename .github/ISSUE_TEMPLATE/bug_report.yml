name: Bug report
description: Something in the Cardlake plugin for Hermes isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what you saw. For a button or a reply that went wrong, a screenshot of the chat helps most.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send /cardlake today in Telegram
        2. Tap Tomorrow on a card
        3. See ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Versions and where it runs
      description: The plugin version (`hermes plugins list`), your Hermes version, the chat platform, and cardlake.app or a self-hosted Cardlake.
      placeholder: "plugin 0.7.4, Hermes 0.23.0, Telegram private chat, cardlake.app"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Hermes log lines
      description: Lines starting with `Cardlake:` from `hermes logs`. Remove anything private first. This will be formatted as code automatically.
      render: shell
